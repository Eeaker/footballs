[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-metric-running-demo"
version = "0.1.0"
description = "Football tracking, event slicing, rotating-camera homography and metric running demo"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
  "ultralytics==8.3.228",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0,<3.0",
  "scipy>=1.14.0,<2.0",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "lapx>=0.5.5",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["pipeline"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["running_metrics_v1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
