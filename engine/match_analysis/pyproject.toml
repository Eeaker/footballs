[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-match-analysis"
version = "0.1.0"
description = "Metric possession, passing network and deterministic acceptance tooling"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8", "PyYAML>=6,<7", "openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
