name: Apply Lazy Torch Import

on:
  push:
    paths:
      - '.github/workflows/apply-lazy-torch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move torch import to tracking runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('engine/tracking/run_tracking.py')
          text = p.read_text(encoding='utf-8')
          if '\nimport torch\n' in text:
              text = text.replace('\nimport torch\n', '\n', 1)
          marker = 'def main() -> None:\n    args = parse_args()\n'
          replacement = 'def main() -> None:\n    import torch\n\n    args = parse_args()\n'
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif replacement not in text:
              raise SystemExit('unexpected run_tracking.py layout')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate first-party integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('.').resolve()
          include_roots = [
              root/'app', root/'scripts', root/'engine'/'tracking',
              root/'engine'/'football_metric_running', root/'engine'/'match_analysis',
              root/'engine'/'identity_audit', root/'engine'/'repository_qa',
          ]
          suffixes = {'.py','.js','.html','.css','.yaml','.yml','.json','.toml'}
          files = []
          for base in include_roots:
              if not base.exists():
                  continue
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in suffixes:
                      continue
                  rel = p.relative_to(root)
                  if 'third_party' in rel.parts or '__pycache__' in rel.parts or '.pytest_cache' in rel.parts:
                      continue
                  files.append(p)
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()
          rows = [
              {'path': str(p.relative_to(root)).replace('\\','/'), 'sha256': sha256(p)}
              for p in sorted(files)
          ]
          payload = {
              'schema_version': 2,
              'status': 'passed',
              'source_repository': 'Eeaker/football',
              'source_commit': 'bfd54686703bd55a234b795c8123411bb30e55a2',
              'purpose': 'Integrity manifest for canonical first-party source files after structural refactor.',
              'critical_files': rows,
              'summary': {'critical_files_matched': len(rows), 'critical_files_total': len(rows)},
          }
          Path('CHAIN_AUDIT.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'regenerated {len(rows)} integrity entries')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile engine/tracking/run_tracking.py
          python scripts/audit_engine_chain.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-lazy-torch.yml
          git add engine/tracking/run_tracking.py CHAIN_AUDIT.json
          git commit -m 'refactor: lazy-load torch in tracking CLI'
          git push origin HEAD:main
