name: Verify Formal Production Source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-web.txt
            engine/match_analysis/requirements.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest openpyxl scipy 'jsonschema>=4,<5' 'httpx>=0.27,<1'

      - name: Validate production repository structure
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .refactor
          test ! -d engine/football_metric_running_github
          test ! -d engine/repository_qa
          test -d engine/tracking/tracking_lib
          test -d engine/match_analysis/analysis_lib
          test -f engine/match_analysis/analysis_lib/tracking_adapter.py
          test -f PRESENT_WINDOWS.vbs
          test ! -f engine/match_analysis/run_stage4_from_artifacts.py
          test ! -f engine/match_analysis/export_task3_final_demo.py
          test ! -f engine/tracking/export_player_demo.py
          test ! -f engine/tracking/export_five_event_compilation.py
          test ! -f engine/football_metric_running/src/pipeline.py
          if find . -path './.git' -prune -o -path './.github' -prune -o -iname '*week*' -print | grep -q .; then
            echo 'week-based file or directory name remains'
            exit 1
          fi
          if grep -RInE --exclude-dir=third_party --exclude-dir=vendor --exclude-dir=.pytest_cache --exclude='*.md' '(week2|week3)' app engine scripts 2>/dev/null; then
            echo 'week-based first-party code reference remains'
            exit 1
          fi
          if grep -RIn 'metric_pitch_with_possession_and_passes\.mp4' app engine scripts docs README.md 2>/dev/null; then
            echo 'duplicate metric pitch output contract remains'
            exit 1
          fi

      - name: Enforce formal-source boundaries
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find engine \
            \( -path '*/third_party/*' -o -path '*/vendor/*' -o -path '*/licenses/*' \) -prune -o \
            -type f \( -iname '*demo*' -o -iname '*prototype*' -o -iname '*boss*' -o -iname '*stage4*' -o -iname '*experiment*' \) -print)
          test -z "$bad" || { echo 'Non-production first-party source remains:'; echo "$bad"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import hashlib
          skip={'.git','third_party','vendor','licenses','demo_data','.pytest_cache','__pycache__'}
          groups={}
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.stat().st_size < 100 or any(part in skip for part in path.parts):
                  continue
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              groups.setdefault(digest,[]).append(str(path))
          duplicates=[files for files in groups.values() if len(files)>1]
          if duplicates:
              print('Unexpected first-party exact duplicate files:')
              for files in duplicates:
                  print(*files,sep='\n'); print()
              raise SystemExit(1)
          PY

      - name: Compile and integrity audit
        run: |
          python -m compileall -q app engine scripts
          python scripts/audit_engine_chain.py
          python scripts/validate_windows_launchers.py

      - name: Product tests
        run: python -m pytest -q app/tests

      - name: Tracking tests
        working-directory: engine/tracking
        run: python -m pytest -q

      - name: Identity audit tests
        working-directory: engine/identity_audit
        env:
          PYTHONPATH: ../tracking:.
        run: python -m pytest -q

      - name: Match analysis tests
        working-directory: engine/match_analysis
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Metric running algorithm tests
        working-directory: engine/football_metric_running
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_running_metrics.py

      - name: Product API acceptance
        run: |
          python scripts/verify_product.py
          python scripts/acceptance_check.py
