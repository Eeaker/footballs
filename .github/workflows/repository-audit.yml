name: Repository Audit

on:
  push:
    paths:
      - .github/workflows/repository-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source repository
        run: git clone --depth 1 https://github.com/Eeaker/football.git source

      - name: Build audit report
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path("source")
          files = [p for p in root.rglob("*") if p.is_file() and ".git" not in p.parts]
          dirs = [p for p in root.rglob("*") if p.is_dir() and ".git" not in p.parts]

          extension_counts = Counter((p.suffix.lower() or "<none>") for p in files)
          week_paths = [str(p.relative_to(root)) for p in [*dirs, *files] if re.search(r"week", p.name, re.I)]

          duplicate_groups = defaultdict(list)
          for p in files:
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              duplicate_groups[hashlib.sha256(data).hexdigest()].append(str(p.relative_to(root)))
          exact_duplicates = [v for v in duplicate_groups.values() if len(v) > 1]
          exact_duplicates.sort(key=lambda g: (-len(g), g[0]))

          top_level = []
          for p in sorted(root.iterdir(), key=lambda x: x.name.lower()):
              if p.name == ".git":
                  continue
              if p.is_dir():
                  count = sum(1 for x in p.rglob("*") if x.is_file())
                  size = sum(x.stat().st_size for x in p.rglob("*") if x.is_file())
                  top_level.append({"path": p.name, "type": "dir", "files": count, "bytes": size})
              else:
                  top_level.append({"path": p.name, "type": "file", "bytes": p.stat().st_size})

          report = {
              "file_count": len(files),
              "directory_count": len(dirs),
              "total_bytes": sum(p.stat().st_size for p in files),
              "top_level": top_level,
              "extension_counts": dict(extension_counts.most_common()),
              "week_named_paths": sorted(week_paths),
              "exact_duplicate_groups": exact_duplicates,
          }
          Path("audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))

      - name: Package source snapshot
        run: |
          rm -rf source/.git
          tar -czf football-source.tgz source audit.json

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: football-source-audit
          path: football-source.tgz
          retention-days: 1
