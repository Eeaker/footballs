name: Prepare Clean Gitee Source Snapshot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-gitee-snapshot.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build clean Gitee snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, shutil, subprocess, zipfile

          root = Path.cwd()
          out = root / 'dist' / 'footballs-gitee-source'
          out.parent.mkdir(parents=True, exist_ok=True)
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          excluded_prefixes = ('demo_data/',)
          excluded_exact = {'.github/workflows/prepare-gitee-snapshot.yml'}
          copied = []
          for rel in tracked:
              if not rel:
                  continue
              if rel in excluded_exact or rel.startswith(excluded_prefixes):
                  continue
              src = root / rel
              if not src.is_file():
                  continue
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied.append(rel)

          # Gitee snapshot must never accidentally accept demo material later.
          gi = out / '.gitignore'
          text = gi.read_text(encoding='utf-8') if gi.exists() else ''
          if 'demo_data/' not in text.splitlines():
              text = text.rstrip() + '\n\n# Gitee production-source mirror: demo material is intentionally excluded.\ndemo_data/\n'
          gi.write_text(text, encoding='utf-8')

          # Keep the public README coherent with the demo-free production snapshot.
          readme = out / 'README.md'
          s = readme.read_text(encoding='utf-8')
          s = s.replace('  repository_qa/           仓库级验证入口\n', '')
          s = s.replace('demo_data/reference_match/ 只读参考比赛结果，用于产品层验收\n', '')
          s = s.replace('仓库不分发 NVIDIA 驱动、CUDA、Python 虚拟环境、完整比赛视频或 `yolov8x.pt`。`demo_data/reference_match` 只用于界面和数据契约验收，不应被当作新素材推理证明。号码、传球、真实身份和八维评估在未人工确认时仍按候选/待评估展示。',
                        '仓库不分发 NVIDIA 驱动、CUDA、Python 虚拟环境、完整比赛视频、Demo 数据或 `yolov8x.pt`。号码、传球、真实身份和八维评估在未人工确认时仍按候选/待评估展示。')
          readme.write_text(s, encoding='utf-8')

          # Keep system manifest consistent with the demo-free mirror.
          mf = out / 'SYSTEM_MANIFEST.json'
          if mf.exists():
              data = json.loads(mf.read_text(encoding='utf-8'))
              data['product_positioning'] = 'Windows 优先的正式足球比赛视频分析系统；本 Gitee 镜像仅包含正式源码，不包含 Demo 数据。'
              folders = data.get('package_contents', {}).get('top_level_folders', [])
              data['package_contents']['top_level_folders'] = [x for x in folders if x != 'demo_data']
              data['package_contents']['not_bundled_by_design'] = list(dict.fromkeys(
                  data['package_contents'].get('not_bundled_by_design', []) + ['Demo / reference-match data']
              ))
              mf.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Hard Gitee gates: no demo path and no tracked file over 50 MiB.
          demo_hits = [p.as_posix() for p in out.rglob('*') if 'demo_data' in p.parts]
          if demo_hits:
              raise SystemExit('demo files leaked into snapshot: ' + ', '.join(demo_hits[:20]))
          large = [(p.relative_to(out).as_posix(), p.stat().st_size) for p in out.rglob('*') if p.is_file() and p.stat().st_size > 50 * 1024 * 1024]
          if large:
              raise SystemExit('files exceed strict 50 MiB Gitee gate: ' + repr(large))

          files = [p for p in out.rglob('*') if p.is_file()]
          total = sum(p.stat().st_size for p in files)
          report = {
              'source_repository': 'Eeaker/footballs',
              'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'policy': 'production source only; demo_data excluded; no Git history; strict max file size 50 MiB',
              'file_count': len(files),
              'uncompressed_bytes': total,
              'demo_files': 0,
              'files_over_50_mib': 0,
          }
          (root / 'dist' / 'gitee-snapshot-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          zip_path = root / 'dist' / 'footballs-gitee-source.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in files:
                  zf.write(p, p.relative_to(out).as_posix())
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print('zip_bytes=', zip_path.stat().st_size)
          PY

      - name: Upload clean source artifact
        uses: actions/upload-artifact@v4
        with:
          name: footballs-gitee-source
          path: |
            dist/footballs-gitee-source.zip
            dist/gitee-snapshot-report.json
          if-no-files-found: error
          retention-days: 3
