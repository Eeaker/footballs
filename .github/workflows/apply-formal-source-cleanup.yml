name: Apply Formal Source Cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-formal-source-cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Reduce repository to formal production source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil

          p=Path('engine/tracking/run_pipeline.py'); s=p.read_text(encoding='utf-8')
          for line in ['    id_focus = output / "id_focus"\n','    mosaics = output / "identity_mosaics"\n','    highlights = output / "candidate_highlights"\n','    review = output / "human_review"\n']:
              s=s.replace(line,'')
          marker='        run([\n            sys.executable, str(ROOT / "make_id_focus_clips.py"),'
          if marker in s:
              a=s.index(marker); b=s.index('        tracking_final.mkdir(parents=True, exist_ok=True)',a); s=s[:a]+s[b:]
          marker='        run([\n            sys.executable, str(ROOT / "validate_delivery.py"),'
          if marker in s:
              a=s.index(marker); b=s.index('\n\n    shutil.rmtree(work)',a); s=s[:a]+s[b:]
          s=s.replace('"pipeline": "tracking_delivery_v3"','"pipeline": "tracking_pipeline_v4"')
          s=s.replace('            "evaluation": "closed_candidate_labels_plus_human_review_no_scoring",\n            "highlight": f"{event_count}_candidates_each_{pre_sec}s_before_and_{post_sec}s_after",\n            "validation_profile": "adaptive" if config else "v3_exact",\n','            "evaluation": "canonical_tracking_outputs_only",\n')
          s=s.replace('                output / "quality_report.json",\n                review / "events_for_human_review.json",\n','')
          p.write_text(s,encoding='utf-8')

          obsolete=[
            'engine/football_metric_running/src/pipeline.py','engine/football_metric_running/tests/test_frame_domain.py',
            'engine/football_metric_running/src/running_metrics_v1/render_demo.py','engine/football_metric_running/ARTIFACTS.md',
            'engine/football_metric_running/.gitattributes','engine/football_metric_running/scripts',
            'engine/repository_qa',
            'engine/match_analysis/export_acceptance_clips.py','engine/match_analysis/export_task3_final_demo.py',
            'engine/match_analysis/prepare_reference_player_card_inputs.py','engine/match_analysis/prototypes',
            'engine/match_analysis/reclassify_ocr_boss_compatible.py','engine/match_analysis/render_ocr_policy_contact_sheet.py',
            'engine/match_analysis/run_stage4_from_artifacts.py',
            'engine/match_analysis/tests/test_export_acceptance_clips.py',
            'engine/match_analysis/tests/test_reclassify_ocr_boss_compatible.py',
            'engine/match_analysis/tests/test_task3_final_demo.py',
            'engine/tracking/export_five_event_compilation.py','engine/tracking/export_player_demo.py',
            'engine/tracking/build_montage.py','engine/tracking/build_identity_mosaics.py',
            'engine/tracking/generate_review_manifest.py','engine/tracking/validate_delivery.py',
            'engine/tracking/tests/test_export_five_event_compilation.py','engine/tracking/tests/test_export_player_demo.py',
            'engine/tracking/tests/test_frozen_product_policy.py','engine/tracking/tests/test_review_manifest.py',
            'engine/tracking/config/labels_7d.json',
            'engine/identity_audit/run_experiment.py','engine/identity_audit/run_local_change_experiment.py',
            'engine/identity_audit/run_open_set_occlusion_experiment.py','engine/identity_audit/reanalyze_cached_open_set.py',
            'engine/identity_audit/render_candidate_storyboards.py','engine/identity_audit/render_open_set_candidates.py',
          ]
          for name in obsolete:
              q=Path(name)
              if q.is_dir(): shutil.rmtree(q)
              elif q.exists(): q.unlink()

          p=Path('engine/football_metric_running/README.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('├─ evaluate_rotation_registration.py\n└─ render_demo.py','└─ evaluate_rotation_registration.py')
          p.write_text(s,encoding='utf-8')
          p=Path('engine/match_analysis/README.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('输出包含 `analysis/`、`metric_running/`、`integrated_manifest.json` 和 2D 球场视频。','输出包含 `analysis/`、`metric_running/` 和 `integrated_manifest.json`。2D 球场回放只在产品报告阶段通过 `render_metric_pitch.py` 生成一次。')
          p.write_text(s,encoding='utf-8')

          exts={'.py','.js','.html','.css','.yaml','.yml','.json','.toml'}; skip={'third_party','vendor','licenses','__pycache__','.pytest_cache'}; rows=[]
          for base in map(Path,['app','engine','scripts']):
              for q in base.rglob('*'):
                  if q.is_file() and q.suffix.lower() in exts and not any(x in skip for x in q.parts):
                      rows.append({'path':q.as_posix(),'sha256':hashlib.sha256(q.read_bytes()).hexdigest()})
          rows.sort(key=lambda x:x['path'])
          audit={'schema_version':2,'status':'passed','source_repository':'Eeaker/football','source_commit':'bfd54686703bd55a234b795c8123411bb30e55a2','purpose':'Integrity manifest for canonical first-party production source after formal-source cleanup.','critical_files':rows,'summary':{'critical_files_total':len(rows),'critical_files_matched':len(rows)}}
          Path('CHAIN_AUDIT.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt pytest openpyxl scipy 'jsonschema>=4,<5' httpx

      - name: Verify cleaned source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app engine scripts
          python scripts/audit_engine_chain.py
          python scripts/validate_windows_launchers.py
          python -m pytest -q app/tests
          (cd engine/tracking && python -m pytest -q)
          (cd engine/identity_audit && PYTHONPATH=../tracking:. python -m pytest -q)
          (cd engine/match_analysis && PYTHONPATH=. python -m pytest -q)
          (cd engine/football_metric_running && PYTHONPATH=src python -m pytest -q tests/test_running_metrics.py)
          python scripts/verify_product.py
          python scripts/acceptance_check.py
          python scripts/generate_release_metadata.py

      - name: Enforce formal-source hygiene
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/workflows/apply-formal-source-cleanup.yml .github/workflows/source-cleanup-audit.yml .github/workflows/source-audit-temp.yml
          bad=$(find engine -type f \( -iname '*demo*' -o -iname '*prototype*' -o -iname '*boss*' -o -iname '*stage4*' -o -iname '*experiment*' \) -print)
          test -z "$bad" || { echo "$bad"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import hashlib
          skip={'.git','third_party','vendor','licenses','demo_data','.pytest_cache'}; groups={}
          for p in Path('.').rglob('*'):
              if p.is_file() and p.stat().st_size>=100 and not any(x in skip for x in p.parts): groups.setdefault(hashlib.sha256(p.read_bytes()).hexdigest(),[]).append(str(p))
          dup=[v for v in groups.values() if len(v)>1]
          if dup:
              for g in dup: print(*g,sep='\n'); print()
              raise SystemExit('unexpected first-party exact duplicates remain')
          PY

      - name: Commit formal source cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: reduce repository to formal production source'
          git push origin main
